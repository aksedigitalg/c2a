<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.json">
  <title>Gebze — Profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/transitions.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="profile" class="page-container" x-data="profileScreen()">

      <!-- Profil Başlık -->
      <div class="prof-header">
        <div class="prof-avatar">
          <i data-lucide="user"></i>
        </div>
        <h1 class="prof-name" x-text="$store.app.user.name"></h1>
        <p class="prof-email" x-text="$store.app.user.email"></p>
        <a href="edit-profile.html" class="btn-secondary btn-small prof-edit-btn">Profili Düzenle</a>
      </div>

      <!-- Menü -->
      <nav class="prof-menu">
        <template x-for="item in menuItems" :key="item.id">
          <a :href="item.link" class="prof-menu-item">
            <div class="prof-menu-left">
              <i :data-lucide="item.icon"></i>
              <span x-text="item.label"></span>
            </div>
            <i data-lucide="chevron-right" class="prof-menu-arrow"></i>
          </a>
        </template>
      </nav>

      <!-- Çıkış -->
      <div class="prof-logout-wrap">
        <a href="onboarding.html" class="prof-logout-btn">
          <i data-lucide="log-out"></i>
          Çıkış Yap
        </a>
      </div>

    </main>
  </div>

  <!-- Alt Navigasyon -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <i data-lucide="home"></i>
      <span>Anasayfa</span>
    </a>
    <a href="search.html" class="nav-item">
      <i data-lucide="search"></i>
      <span>Arama</span>
    </a>
    <a href="home.html" class="nav-item">
      <i data-lucide="layout-grid"></i>
      <span>Kategoriler</span>
    </a>
    <a href="campaigns.html" class="nav-item">
      <i data-lucide="tag"></i>
      <span>Kampanyalar</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <i data-lucide="user"></i>
      <span>Profil</span>
    </a>
  </nav>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="../js/app.js"></script>
  <script src="../js/profile.js"></script>

</body>
</html>
