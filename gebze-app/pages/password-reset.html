<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.json">
  <title>Gebze — Şifre Sıfırla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/transitions.css">
  <link rel="stylesheet" href="../css/password-reset.css">
</head>
<body>

  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="password-reset" class="page-container">

      <div x-data="{ email: '', sent: false }">
        <header class="top-bar">
          <a href="login.html" class="top-bar-back">
            <i data-lucide="chevron-left"></i>
          </a>
          <div></div>
          <div></div>
        </header>

        <div class="pr-content">
          <div x-show="!sent">
            <h1 class="pr-title">Şifre Sıfırla</h1>
            <p class="pr-subtitle">E-posta adresinizi girin, size sıfırlama bağlantısı gönderelim</p>

            <form @submit.prevent="if(email) sent = true" class="pr-form">
              <div class="input-group">
                <label class="input-label">E-posta</label>
                <div class="input-with-icon">
                  <i data-lucide="mail" class="input-icon"></i>
                  <input type="email" class="input-field" placeholder="E-posta adresiniz" x-model="email" autocomplete="email">
                </div>
              </div>
              <button type="submit" class="btn-primary" :disabled="!email">
                Gönder
              </button>
            </form>
          </div>

          <div
            x-show="sent"
            x-transition:enter="success-enter"
            x-transition:enter-start="success-enter-start"
            x-transition:enter-end="success-enter-end"
            class="pr-success"
          >
            <div class="pr-success-icon">
              <i data-lucide="check-circle"></i>
            </div>
            <h2 class="pr-success-title">Sıfırlama bağlantısı gönderildi</h2>
            <p class="pr-success-text">E-posta kutunuzu kontrol edin</p>
            <a href="login.html" class="btn-secondary pr-success-btn">
              Giriş sayfasına dön
            </a>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="../js/app.js"></script>
  <script src="../js/password-reset.js"></script>

</body>
</html>
