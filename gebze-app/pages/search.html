<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.json">
  <title>Gebze — Arama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/transitions.css">
  <link rel="stylesheet" href="../css/search.css">
</head>
<body>

  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="search" class="page-container" x-data="searchScreen()" x-init="init()">

      <!-- Top Bar Arama -->
      <header class="search-top-bar">
        <a href="home.html" class="top-bar-back">
          <i data-lucide="chevron-left"></i>
        </a>
        <div class="search-input-wrap">
          <i data-lucide="search" class="search-input-icon"></i>
          <input
            type="text"
            class="search-input-field"
            placeholder="Gebze'de ara..."
            x-model="query"
            x-ref="searchInput"
            autocomplete="off"
          >
          <button
            class="search-clear-btn"
            x-show="query.length > 0"
            @click="query = ''"
          >
            <i data-lucide="x"></i>
          </button>
        </div>
      </header>

      <!-- Son Aramalar -->
      <section x-show="!showResults" class="section">
        <div class="section-header">
          <h2 class="section-title search-section-title">Son Aramalar</h2>
          <button class="btn-ghost search-clear-all" @click="clearRecents()">Temizle</button>
        </div>
        <div class="search-list">
          <template x-for="(item, index) in recentSearches" :key="index">
            <div class="search-row" @click="query = item">
              <div class="search-row-left">
                <i data-lucide="clock"></i>
                <span x-text="item"></span>
              </div>
              <button class="search-row-remove" @click.stop="removeRecent(index)">
                <i data-lucide="x"></i>
              </button>
            </div>
          </template>
        </div>
      </section>

      <!-- Popüler Aramalar -->
      <section x-show="!showResults" class="section">
        <div class="section-header">
          <h2 class="section-title search-section-title">Popüler Aramalar</h2>
        </div>
        <div class="search-chips content-pad">
          <template x-for="item in popularSearches" :key="item">
            <button class="chip" @click="query = item">
              <i data-lucide="trending-up"></i>
              <span x-text="item"></span>
            </button>
          </template>
        </div>
      </section>

      <!-- Arama Sonuçları -->
      <section x-show="showResults" class="section">
        <div class="search-list">
          <template x-for="item in results" :key="item.id">
            <a :href="item.link" class="search-result-row">
              <div class="search-result-icon">
                <i :data-lucide="item.icon"></i>
              </div>
              <div class="search-result-body">
                <span class="search-result-name" x-text="item.name"></span>
                <span class="search-result-cat" x-text="item.category"></span>
              </div>
              <i data-lucide="chevron-right" class="search-result-arrow"></i>
            </a>
          </template>
          <div x-show="results.length === 0" class="search-no-result">
            <i data-lucide="search-x"></i>
            <span>"<span x-text="query"></span>" için sonuç bulunamadı</span>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- Alt Navigasyon -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <i data-lucide="home"></i>
      <span>Anasayfa</span>
    </a>
    <a href="search.html" class="nav-item active">
      <i data-lucide="search"></i>
      <span>Arama</span>
    </a>
    <a href="home.html" class="nav-item">
      <i data-lucide="layout-grid"></i>
      <span>Kategoriler</span>
    </a>
    <a href="campaigns.html" class="nav-item">
      <i data-lucide="tag"></i>
      <span>Kampanyalar</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i data-lucide="user"></i>
      <span>Profil</span>
    </a>
  </nav>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="../js/app.js"></script>
  <script src="../js/search.js"></script>

</body>
</html>
