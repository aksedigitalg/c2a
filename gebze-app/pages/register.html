<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.json">
  <title>Gebze — Kayıt Ol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/transitions.css">
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>

  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="register" class="page-container">

      <div x-data="registerForm()">
        <header class="top-bar">
          <a href="onboarding.html" class="top-bar-back">
            <i data-lucide="chevron-left"></i>
          </a>
          <div></div>
          <div></div>
        </header>

        <div class="register-content">
          <h1 class="register-title">Hesap Oluştur</h1>
          <p class="register-subtitle">Gebze'yi keşfetmeye başla</p>

          <form @submit.prevent="handleRegister()" class="register-form">
            <div class="input-group">
              <label class="input-label">Ad Soyad</label>
              <div class="input-with-icon">
                <i data-lucide="user" class="input-icon"></i>
                <input type="text" class="input-field" placeholder="Adınız ve soyadınız" x-model="name" autocomplete="name">
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">E-posta</label>
              <div class="input-with-icon">
                <i data-lucide="mail" class="input-icon"></i>
                <input type="email" class="input-field" placeholder="E-posta adresiniz" x-model="email" autocomplete="email">
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">Telefon</label>
              <div class="input-with-icon register-phone-wrap">
                <span class="register-phone-prefix">+90</span>
                <input type="tel" class="input-field register-phone-input" placeholder="5XX XXX XX XX" x-model="phone" autocomplete="tel">
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">Şifre</label>
              <div class="input-with-icon">
                <i data-lucide="lock" class="input-icon"></i>
                <input :type="showPassword ? 'text' : 'password'" class="input-field" placeholder="En az 8 karakter" x-model="password">
                <button type="button" class="input-icon-right password-toggle" @click="showPassword = !showPassword">
                  <i :data-lucide="showPassword ? 'eye-off' : 'eye'"></i>
                </button>
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">Şifre Tekrar</label>
              <div class="input-with-icon">
                <i data-lucide="lock" class="input-icon"></i>
                <input :type="showPasswordConfirm ? 'text' : 'password'" class="input-field" placeholder="Şifrenizi tekrar girin" x-model="passwordConfirm">
                <button type="button" class="input-icon-right password-toggle" @click="showPasswordConfirm = !showPasswordConfirm">
                  <i :data-lucide="showPasswordConfirm ? 'eye-off' : 'eye'"></i>
                </button>
              </div>
            </div>

            <div class="register-terms" @click="termsAccepted = !termsAccepted">
              <div class="checkbox-custom" :class="{ 'checkbox-active': termsAccepted }">
                <i data-lucide="check" x-show="termsAccepted"></i>
              </div>
              <p class="register-terms-text">
                <a href="#" data-barba-prevent="self" class="register-terms-link">Kullanım Şartları</a>
                ve
                <a href="#" data-barba-prevent="self" class="register-terms-link">Gizlilik Politikası</a>'nı kabul ediyorum
              </p>
            </div>

            <button type="submit" class="btn-primary" :disabled="!isValid">
              Kayıt Ol
            </button>
          </form>

          <p class="register-login-text">
            Zaten hesabınız var mı?
            <a href="login.html" class="register-login-link">Giriş Yap</a>
          </p>
        </div>
      </div>

    </main>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="../js/app.js"></script>
  <script src="../js/register.js"></script>

</body>
</html>
