<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.json">
  <title>Gebze — Restoran Menü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/transitions.css">
  <link rel="stylesheet" href="../css/food-order-detail.css">
</head>
<body>

  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="food-order-detail" class="page-container fod-page" x-data="foodOrderDetail()">

      <!-- Hero Image -->
      <div class="fod-hero">
        <div class="image-placeholder fod-hero-image"></div>
        <a href="food-order.html" class="fod-back-btn btn-icon">
          <i data-lucide="chevron-left"></i>
        </a>
      </div>

      <!-- Info Card -->
      <div class="fod-info-card">
        <h1 class="fod-rest-name" x-text="restaurant.name"></h1>
        <p class="fod-rest-cuisine" x-text="restaurant.cuisine"></p>
        <div class="info-row fod-rest-meta">
          <i data-lucide="star"></i>
          <span x-text="restaurant.rating + ' (' + restaurant.reviewCount + ')'"></span>
          <span class="info-dot"></span>
          <i data-lucide="clock"></i>
          <span x-text="restaurant.time"></span>
          <span class="info-dot"></span>
          <i data-lucide="truck"></i>
          <span x-text="restaurant.delivery"></span>
        </div>
        <div class="fod-status">
          <span class="fod-status-dot" :class="restaurant.isOpen ? 'fod-status-open' : 'fod-status-closed'"></span>
          <span x-text="restaurant.isOpen ? 'Açık' : 'Kapalı'"></span>
        </div>
      </div>

      <!-- Menu Tab Bar -->
      <div class="fod-tab-bar scroll-x">
        <template x-for="tab in menuTabs" :key="tab">
          <button
            class="fod-tab"
            :class="{ 'fod-tab-active': activeMenuTab === tab }"
            @click="activeMenuTab = tab"
            x-text="tab"
          ></button>
        </template>
      </div>

      <!-- Menu Items -->
      <div class="fod-menu-list content-pad">
        <template x-for="item in filteredMenu" :key="item.id">
          <div class="fod-menu-item">
            <div class="fod-menu-info">
              <h4 class="fod-menu-name" x-text="item.name"></h4>
              <p class="fod-menu-desc" x-text="item.desc"></p>
              <span class="fod-menu-price" x-text="'₺' + item.price"></span>
            </div>
            <div class="fod-menu-right">
              <div class="image-placeholder fod-menu-image"></div>
              <button class="fod-add-btn" @click="addToCart(item)">
                <i data-lucide="plus"></i>
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- Cart Bar -->
      <div
        class="fod-cart-bar"
        x-show="cartCount > 0"
        x-transition:enter="transition-enter"
        x-transition:enter-start="transition-enter-start"
        x-transition:enter-end="transition-enter-end"
      >
        <div class="fod-cart-left">
          <i data-lucide="shopping-cart"></i>
          <span x-text="cartCount + ' Ürün'"></span>
        </div>
        <div class="fod-cart-right">
          <span class="fod-cart-total" x-text="'₺' + cartTotal"></span>
          <i data-lucide="chevron-right"></i>
        </div>
      </div>

    </main>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="../js/app.js"></script>
  <script src="../js/food-order-detail.js"></script>

</body>
</html>
