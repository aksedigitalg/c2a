<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.json">
  <title>Gebze — İlanlar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/transitions.css">
  <link rel="stylesheet" href="../css/ads-home.css">
</head>
<body>

  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="ads-home" class="page-container" x-data="adsHome()">

      <header class="top-bar">
        <a href="home.html" class="top-bar-back">
          <i data-lucide="chevron-left"></i>
        </a>
        <span class="top-bar-title">İlanlar</span>
        <button class="btn-small ah-post-btn">
          <i data-lucide="plus"></i>
          İlan Ver
        </button>
      </header>

      <!-- Arama -->
      <div class="content-pad ah-search">
        <div class="ah-search-bar">
          <i data-lucide="search"></i>
          <span>İlanlarda ara...</span>
        </div>
      </div>

      <!-- Filtreler -->
      <div class="scroll-x ah-filters">
        <template x-for="filter in filters" :key="filter">
          <button class="chip" :class="{ 'chip-active': activeFilter === filter }" @click="activeFilter = filter" x-text="filter"></button>
        </template>
      </div>

      <!-- Öne Çıkan -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Öne Çıkan</h2>
          <span class="chip chip-small ah-sponsored">Sponsorlu</span>
        </div>
        <div class="scroll-x">
          <template x-for="ad in featuredAds" :key="ad.id">
            <a href="ad-detail.html" class="ah-featured-card">
              <div class="ah-featured-image-wrap">
                <div class="image-placeholder ah-featured-image"></div>
                <span class="ah-featured-badge">Öne Çıkan</span>
              </div>
              <div class="ah-featured-body">
                <span class="ah-featured-price" x-text="ad.price"></span>
                <p class="ah-featured-title" x-text="ad.title"></p>
                <div class="info-row">
                  <i data-lucide="map-pin"></i>
                  <span x-text="ad.location"></span>
                  <span class="info-dot"></span>
                  <span x-text="ad.date"></span>
                </div>
              </div>
            </a>
          </template>
        </div>
      </section>

      <!-- Son Eklenenler -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Son Eklenenler</h2>
        </div>
        <div class="ah-grid content-pad">
          <template x-for="ad in filtered" :key="ad.id">
            <a href="ad-detail.html" class="ah-ad-card">
              <div class="image-placeholder ah-ad-image"></div>
              <div class="ah-ad-body">
                <span class="ah-ad-price" x-text="ad.price"></span>
                <p class="ah-ad-title" x-text="ad.title"></p>
                <div class="info-row ah-ad-meta">
                  <i data-lucide="map-pin"></i>
                  <span x-text="ad.location"></span>
                  <span class="info-dot"></span>
                  <span x-text="ad.date"></span>
                </div>
              </div>
            </a>
          </template>
        </div>
      </section>

    </main>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="../js/app.js"></script>
  <script src="../js/ads-home.js"></script>

</body>
</html>
